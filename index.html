<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - BobaTea</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/admin.css">
</head>
<body class="admin-body">
  
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo">
      <a href="../index.html" class="logo text-xl">🧋 <span>BobaTea Admin</span></a>
    </div>
    
    <nav class="admin-nav">
      <a href="index.html" class="admin-nav-item active">
        <i class="fas fa-home"></i> Tổng Quan
      </a>
      <a href="orders.html" class="admin-nav-item">
        <i class="fas fa-shopping-cart"></i> Đơn Hàng
      </a>
      <a href="products.html" class="admin-nav-item">
        <i class="fas fa-box"></i> Sản Phẩm
      </a>
      <a href="#" class="admin-nav-item">
        <i class="fas fa-users"></i> Khách Hàng
      </a>
      <a href="#" class="admin-nav-item">
        <i class="fas fa-chart-bar"></i> Báo Cáo
      </a>
    </nav>
    
    <div class="p-6">
      <a href="../index.html" class="btn btn-outline btn-block"><i class="fas fa-external-link-alt"></i> Xem Website</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="flex items-center gap-4">
        <button class="mobile-menu-btn d-lg-none" id="sidebar-toggle">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="text-2xl m-0 font-heading">Dashboard</h1>
      </div>
      
      <div class="admin-user">
        <button id="theme-toggle" class="theme-toggle mr-4"><i class="fas fa-moon"></i></button>
        <span class="font-bold">Admin</span>
        <div class="admin-avatar">A</div>
      </div>
    </header>

    <!-- Stats -->
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div>
        <div class="stat-info">
          <h3>Doanh Thu Hôm Nay</h3>
          <div class="stat-value text-primary" id="today-revenue">0 ₫</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-shopping-bag"></i></div>
        <div class="stat-info">
          <h3>Đơn Hàng Mới</h3>
          <div class="stat-value" id="new-orders">0</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-box"></i></div>
        <div class="stat-info">
          <h3>Tổng Sản Phẩm</h3>
          <div class="stat-value" id="total-products">0</div>
        </div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-users"></i></div>
        <div class="stat-info">
          <h3>Lượt Truy Cập</h3>
          <div class="stat-value">1,240</div>
        </div>
      </div>
    </div>

    <!-- Recent Orders -->
    <div class="admin-card">
      <div class="card-header">
        <h2 class="text-xl m-0 font-heading">Đơn Hàng Gần Đây</h2>
        <a href="orders.html" class="btn btn-outline btn-sm">Xem tất cả</a>
      </div>
      
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Mã Đơn</th>
              <th>Khách Hàng</th>
              <th>Tổng Tiền</th>
              <th>Trạng Thái</th>
              <th>Thời Gian</th>
              <th>Thao Tác</th>
            </tr>
          </thead>
          <tbody id="recent-orders-tbody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { orderManager } from '../js/modules/order.js';
    import { formatVND } from '../js/modules/currency.js';
    import { products } from '../js/data/products.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Setup Theme
      const body = document.documentElement;
      const themeToggle = document.getElementById('theme-toggle');
      
      const currentTheme = localStorage.getItem('theme') || 'light';
      body.setAttribute('data-theme', currentTheme);
      updateThemeIcon(currentTheme);

      themeToggle.addEventListener('click', () => {
        const isDark = body.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        
        body.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
      });

      function updateThemeIcon(theme) {
        if (theme === 'dark') {
          themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        } else {
          themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
        }
      }

      // Sidebar Toggle Mobile
      document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
        document.querySelector('.admin-sidebar').classList.toggle('show');
      });

      // Update Stats
      document.getElementById('total-products').textContent = products.length;
      
      const orders = orderManager.orders;
      
      // Calculate today's revenue and new orders
      const today = new Date().toDateString();
      let todayRev = 0;
      let newOrdCount = 0;
      
      orders.forEach(o => {
        const d = new Date(o.createdAt).toDateString();
        if (d === today) {
          if (o.status !== 'cancelled') {
            todayRev += o.total;
          }
          newOrdCount++;
        }
      });
      
      document.getElementById('today-revenue').textContent = formatVND(todayRev);
      document.getElementById('new-orders').textContent = newOrdCount;

      // Render Recent Orders
      const tbody = document.getElementById('recent-orders-tbody');
      const recentOrders = orderManager.getRecentOrders(5);
      
      if (recentOrders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-light">Chưa có đơn hàng nào</td></tr>';
      } else {
        let html = '';
        recentOrders.forEach(o => {
          let statusClass = '';
          let statusText = '';
          
          switch(o.status) {
            case 'pending': statusClass = 'status-pending'; statusText = 'Chờ xử lý'; break;
            case 'processing': statusClass = 'status-processing'; statusText = 'Đang pha'; break;
            case 'completed': statusClass = 'status-completed'; statusText = 'Đã giao'; break;
            case 'cancelled': statusClass = 'status-cancelled'; statusText = 'Đã hủy'; break;
          }
          
          const date = new Date(o.createdAt);
          
          html += `
            <tr>
              <td><strong>${o.id}</strong></td>
              <td>${o.customer.fullName}<br><span class="text-xs text-light">${o.customer.phone}</span></td>
              <td class="font-bold text-primary">${formatVND(o.total)}</td>
              <td><span class="status ${statusClass}">${statusText}</span></td>
              <td class="text-sm text-light">${date.toLocaleTimeString()} - ${date.toLocaleDateString('vi-VN')}</td>
              <td>
                <div class="action-btns">
                  <button class="btn btn-primary btn-sm"><i class="fas fa-eye"></i></button>
                </div>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
    });
  </script>
</body>
</html>
