<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Kích Hoạt PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        /* Style cho thanh kéo (Slider) */
        input[type=range] { accent-color: #3b82f6; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen font-sans antialiased flex flex-col">

    <nav class="glass sticky top-0 z-50 p-4 shadow-lg border-b border-gray-700">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-400 tracking-widest">PRO<span class="text-white">TOOL</span></h1>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        
        <!-- ================= MÀN HÌNH ĐĂNG NHẬP ================= -->
        <section id="login-section" class="w-full max-w-md glass p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold mb-2">Đăng Nhập Hệ Thống</h2>
                <p class="text-gray-400 text-sm">Nhập Key kích hoạt 32 ký tự.</p>
            </div>
            <div class="space-y-6">
                <input type="text" id="keyInput" placeholder="Nhập License Key..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 font-mono text-center text-sm text-green-400 focus:border-blue-500 focus:outline-none">
                <button onclick="login()" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition">ĐĂNG NHẬP</button>
            </div>
        </section>

        <!-- ================= BẢNG ĐIỀU KHIỂN (DASHBOARD) ================= -->
        <section id="dashboard-section" class="w-full max-w-4xl glass p-8 rounded-2xl shadow-2xl hidden">
            <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                <div>
                    <h2 class="text-3xl font-bold text-green-400" id="dash-title">CONTROL PANEL</h2>
                    <p class="text-gray-400 text-sm" id="dash-subtitle">Đã kết nối máy chủ.</p>
                </div>
                <div class="bg-gray-800 px-4 py-2 rounded-lg border border-gray-600">
                    <span class="text-xs text-gray-400">Thiết bị hỗ trợ:</span>
                    <span class="font-bold text-blue-400 ml-2" id="dash-os">IOS</span>
                </div>
            </div>

            <!-- Nút Cấu Hình -->
            <div class="mb-6">
                <h3 class="text-lg font-bold mb-3 text-gray-300">Cấu Hình Bắn (Profiles)</h3>
                <div id="profile-buttons" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <!-- Nút sẽ được JS tạo tự động tùy loại Key -->
                </div>
            </div>

            <!-- Thanh Kéo (Sliders) -->
            <div class="mb-8">
                <h3 class="text-lg font-bold mb-3 text-gray-300">Tinh Chỉnh Thủ Công (Custom)</h3>
                <div id="sliders-container" class="grid md:grid-cols-2 gap-6 glass-panel p-6 rounded-lg">
                    <!-- Sliders sẽ được JS tạo tự động tùy loại Key -->
                </div>
            </div>

            <button onclick="applySettings()" id="applyBtn" class="w-full bg-gradient-to-r from-green-600 to-blue-600 hover:from-green-500 hover:to-blue-500 py-4 rounded-lg font-bold text-xl shadow-lg transition">
                ÁP DỤNG CẤU HÌNH (INJECT)
            </button>
        </section>

    </main>

    <script>
        // CẤU HÌNH CÁC THÔNG SỐ (GIẢ LẬP)
        const config = {
            basic: {
                os: "IOS Only 🍏",
                title: "BASIC PANEL",
                profiles: [
                    { name: "Nhẹ Tâm", vals: [70, 60, 50, 55] },
                    { name: "Nặng Tâm", vals: [30, 20, 80, 85] },
                    { name: "Xử Lí Tốt", vals: [50, 50, 50, 50] }
                ],
                sliders: ["Sensitivity", "Round", "Smoothness", "Speed"] // 4 thanh cho basic
            },
            vip: {
                os: "IOS & Android 📱",
                title: "VIP AI PANEL",
                profiles: [
                    { name: "AI VIP (Nặng)", vals: [20, 15, 90, 95, 100, 90] },
                    { name: "V2 (Nhẹ Tâm)", vals: [85, 80, 40, 45, 60, 50] },
                    { name: "V1.44 (Xử lí tốt)", vals: [55, 50, 55, 50, 70, 70] },
                    { name: "AI CHECKER", vals: [100, 100, 100, 100, 100, 100] }
                ],
                sliders: ["Sensitivity (AI)", "Round (Max)", "Smooth Tracking", "Speed Inject", "Recoil Control", "Aim Assist"] // 6 thanh cho vip
            }
        };

        // Thuật toán SHA-256
        async function hashKey(key) {
            const msgBuffer = new TextEncoder().encode(key);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function login() {
            const keyInput = document.getElementById('keyInput').value.trim();
            const btn = document.getElementById('loginBtn');
            if (keyInput.length !== 32) { alert("Key phải có 32 ký tự!"); return; }

            btn.innerText = "Đang kiểm tra dữ liệu..."; btn.disabled = true;

            try {
                const hashedKey = await hashKey(keyInput);

                // KIỂM TRA FILE VIP TRƯỚC (Lưu ý: Bạn phải tạo file vip.txt trên Github)
                let isVip = false; let isBasic = false;
                try {
                    // Tạm dùng file key.txt của bạn làm VIP để test
                    const resVip = await fetch('https://raw.githubusercontent.com/loffy327/TEST/refs/heads/main/key.txt');
                    const textVip = await resVip.text();
                    if (textVip.split('\n').map(l => l.trim()).includes(hashedKey)) isVip = true;
                } catch(e) {}

                // KIỂM TRA FILE BASIC (Lưu ý: Bạn phải tạo file basic.txt trên Github)
                if (!isVip) {
                    try {
                        const resBasic = await fetch('https://raw.githubusercontent.com/loffy327/TEST/refs/heads/main/basic.txt');
                        const textBasic = await resBasic.text();
                        if (textBasic.split('\n').map(l => l.trim()).includes(hashedKey)) isBasic = true;
                    } catch(e) {}
                }

                if (isVip) {
                    buildDashboard('vip');
                } else if (isBasic) {
                    buildDashboard('basic');
                } else {
                    alert("❌ Key không tồn tại hoặc đã hết hạn.");
                    btn.innerText = "ĐĂNG NHẬP"; btn.disabled = false;
                }
            } catch (error) {
                alert("Lỗi máy chủ.");
                btn.innerText = "ĐĂNG NHẬP"; btn.disabled = false;
            }
        }

        // Tạo giao diện sau khi đăng nhập
        function buildDashboard(type) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            const data = config[type];
            document.getElementById('dash-title').innerText = data.title;
            document.getElementById('dash-title').className = type === 'vip' ? "text-3xl font-bold text-purple-500" : "text-3xl font-bold text-blue-400";
            document.getElementById('dash-os').innerText = data.os;

            // Tạo Sliders
            const sCont = document.getElementById('sliders-container');
            sCont.innerHTML = '';
            data.sliders.forEach((sName, index) => {
                sCont.innerHTML += `
                    <div>
                        <div class="flex justify-between text-sm text-gray-300 mb-1">
                            <span>${sName}</span> <span id="val-${index}" class="text-blue-400 font-bold">50%</span>
                        </div>
                        <input type="range" id="slider-${index}" min="0" max="100" value="50" class="w-full" oninput="updateVal(${index})">
                    </div>
                `;
            });

            // Tạo Nút Profile
            const pCont = document.getElementById('profile-buttons');
            pCont.innerHTML = '';
            data.profiles.forEach(prof => {
                // Chuyển mảng giá trị thành chuỗi để đưa vào hàm onclick
                const valsStr = JSON.stringify(prof.vals);
                pCont.innerHTML += `
                    <button onclick='applyProfile(${valsStr})' class="bg-gray-800 hover:bg-gray-700 border border-gray-600 py-3 rounded-lg font-bold text-sm text-gray-200 transition focus:ring-2 focus:ring-blue-500">
                        ${prof.name}
                    </button>
                `;
            });
        }

        // Cập nhật số khi kéo thanh
        function updateVal(index) {
            document.getElementById(`val-${index}`).innerText = document.getElementById(`slider-${index}`).value + "%";
        }

        // Khi bấm nút Profile (Nhẹ tâm, Nặng tâm...)
        function applyProfile(vals) {
            vals.forEach((val, index) => {
                const slider = document.getElementById(`slider-${index}`);
                if(slider) {
                    slider.value = val;
                    updateVal(index);
                }
            });
        }

        // Hiệu ứng bấm nút Áp dụng
        function applySettings() {
            const btn = document.getElementById('applyBtn');
            btn.innerText = "ĐANG KẾT NỐI VỚI GAME...";
            btn.classList.add("animate-pulse");
            setTimeout(() => {
                btn.innerText = "✅ ĐÃ ÁP DỤNG CẤU HÌNH THÀNH CÔNG!";
                btn.classList.remove("animate-pulse");
                setTimeout(() => {
                    btn.innerText = "ÁP DỤNG LẠI (INJECT)";
                }, 3000);
            }, 2000);
        }
    </script>
</body>
</html>
